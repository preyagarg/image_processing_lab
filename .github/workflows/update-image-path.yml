name: Update image path

on:
  push:
    paths:
      - '.github/workflows/update-image-path.yml'

permissions:
  contents: write

jobs:
  update-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace sample image extension
        run: |
          sed -i 's/sample_image\.jpg/sample_image.png/g' Assignment1.ipynb Assignment2.ipynb Assignment3.ipynb Assignment4.ipynb Assignment6.ipynb README.md
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assignment1.ipynb Assignment2.ipynb Assignment3.ipynb Assignment4.ipynb Assignment6.ipynb README.md
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Use sample_image.png in all assignments'
            git push
          fi
